trigger:
- main

variables:
  imageName: azure-pipelines-canary-k8s
  acrName: canaryacraniket.azurecr.io
  tag: $(Build.BuildId)

stages:

# =====================================================
# STAGE 1 - BUILD AND PUSH IMAGE
# =====================================================

- stage: Build
  displayName: Build Stage

  jobs:

  - job: Build
    displayName: Build and Push Docker Image

    pool:
      name: azureSubsPool

    steps:

    - checkout: self

    - script: |
        echo "Logging into ACR..."

        az acr login --name canaryacraniket

        echo "Building Docker image..."

        docker build \
          -t $(acrName)/$(imageName):$(tag) \
          -f $(Build.SourcesDirectory)/app/Dockerfile \
          $(Build.SourcesDirectory)/app

        echo "Pushing Docker image..."

        docker push $(acrName)/$(imageName):$(tag)

      displayName: Build and Push Image

    - publish: manifests
      artifact: manifests

    - publish: misc
      artifact: misc


# =====================================================
# STAGE 2 - DEPLOY CANARY
# =====================================================

- stage: DeployCanary
  displayName: Deploy Canary

  dependsOn: Build

  condition: succeeded()

  jobs:

  - deployment: DeployCanary

    displayName: Deploy Canary

    environment: akscanary

    pool:
      name: azureSubsPool

    strategy:

      runOnce:

        deploy:

          steps:

          - checkout: self

          - download: current
            artifact: manifests

          - download: current
            artifact: misc

          - script: |
              kubectl get nodes
            displayName: Verify Kubernetes Cluster

          - script: |
              kubectl create namespace canarydemo \
                --dry-run=client -o yaml | kubectl apply -f -
            displayName: Create Namespace

          - script: |
              kubectl create secret docker-registry my-acr-secret \
                --docker-server=$(acrName) \
                --docker-username=$(ACR_USERNAME) \
                --docker-password=$(ACR_PASSWORD) \
                --namespace canarydemo \
                --dry-run=client -o yaml | kubectl apply -f -
            displayName: Create ACR Secret

          - script: |
              kubectl apply \
                -n canarydemo \
                -f $(Pipeline.Workspace)/manifests/service.yml
            displayName: Deploy Service

          - script: |
              kubectl apply \
                -n canarydemo \
                -f $(Pipeline.Workspace)/manifests/deployment.yml
            displayName: Deploy Application

          - script: |
              kubectl apply \
                -n canarydemo \
                -f $(Pipeline.Workspace)/misc/
            displayName: Deploy Fortio

          - script: |
              kubectl get deployments -n canarydemo
              kubectl get pods -n canarydemo
            displayName: Show Deployments and Pods


# =====================================================
# STAGE 3 - PROMOTE CANARY
# =====================================================

- stage: PromoteCanary

  displayName: Promote Canary

  dependsOn: DeployCanary

  condition: succeeded()

  jobs:

  - deployment: PromoteCanary

    displayName: Promote Canary

    environment: akspromote

    pool:
      name: azureSubsPool

    strategy:

      runOnce:

        deploy:

          steps:

          - script: |
              kubectl get deployments -n canarydemo

              kubectl scale deployment sampleapp-baseline \
                --replicas=4 \
                -n canarydemo

            displayName: Promote Canary


# =====================================================
# STAGE 4 - REJECT / ROLLBACK CANARY
# =====================================================

- stage: RejectCanary

  displayName: Reject Canary

  dependsOn: PromoteCanary

  condition: failed()

  jobs:

  - deployment: RejectCanary

    displayName: Reject Canary

    environment: akscanary

    pool:
      name: azureSubsPool

    strategy:

      runOnce:

        deploy:

          steps:

          - script: |
              kubectl rollout undo deployment/sampleapp-baseline \
                -n canarydemo

            displayName: Rollback Canary